<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Food Rescue AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9f8ed, #f5faf6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #183b2a;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(20,70,40,0.10);
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #e4f5e9;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            margin: 0 auto 20px;
        }

        .login-container h1 {
            text-align: center;
            font-size: 29px;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #748379;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .notice {
            background: #fff0ed;
            color: #b33b2e;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce8df;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #fbfdfb;
        }

        input:focus {
            border-color: #16834a;
            box-shadow: 0 0 0 3px rgba(22,131,74,0.10);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #16834a;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #16834a, #24a45d);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(22,131,74,0.22);
        }

        .auth-bottom {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #748379;
        }

        .auth-bottom a,
        .back-home {
            color: #16834a;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            .login-container h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🍃</div>

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Login to your Food Rescue AI account
        and help make a difference.
    </p>

    {% if message %}
    <div class="notice">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()"
                    id="toggleBtn"
                >
                    Show
                </button>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Login →
        </button>

    </form>

    <p class="auth-bottom">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>

    <a href="{{ url_for('home') }}" class="back-home">
        ← Back to Home
    </a>

</div>

<script>
function togglePassword() {

    const password = document.getElementById("password");
    const button = document.getElementById("toggleBtn");

    if (password.type === "password") {
        password.type = "text";
        button.innerText = "Hide";
    } else {
        password.type = "password";
        button.innerText = "Show";
    }

}
</script>

</body>
</html>
